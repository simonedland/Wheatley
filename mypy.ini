[mypy]
# Third-party libraries used here (elevenlabs, pydub, spotipy, googleapiclient,
# google_auth_oauthlib, pyaudio, openwakeword, pvporcupine, colorama, ...) ship
# without type stubs / py.typed markers. Treat their imports as untyped instead
# of failing the type check on every import line.
ignore_missing_imports = True

# These are informational notes ("bodies of untyped functions are not checked"),
# not type errors. They add noise to the quality gate without indicating a bug.
disable_error_code = annotation-unchecked

# Never type-check local git worktrees created by tooling.
exclude = (^\.claude/|^\.git/)

# The legacy v1 package (``wheatley/``) is being superseded by ``wheatley_V2/``.
# It carries pre-existing type errors (untyped third-party call overloads, etc.)
# that are out of scope for the v2 rebuild; do not let them fail the gate.
[mypy-wheatley]
ignore_errors = True

[mypy-wheatley.*]
ignore_errors = True
