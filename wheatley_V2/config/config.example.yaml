# Wheatley V2 configuration.
#
# Copy this file to config.yaml and edit it:
#     cp config.example.yaml config.yaml
#
# Secrets are NOT stored here. Put them in the repo-root .env file:
#     OPENROUTER_API_KEY=sk-or-v1-...
#     ELEVENLABS_API_KEY=sk_...

llm:
  default: deepseek/deepseek-chat-v3-0324      # "intelligent"
  fast: google/gemini-2.0-flash-001            # low-TTFT alternative
  max_tokens: 2000
  providers:
    deepseek/deepseek-chat-v3-0324: {sort: latency, order: [Together, Fireworks]}
    meta-llama/llama-3.3-70b-instruct: {order: [Groq], allow_fallbacks: false}

stt:
  model: openai/whisper-large-v3-turbo
  provider: {order: [Groq]}
  language: en
  rate: 16000
  silence_limit: 1.0
  threshold: 1500

tts:
  enabled: true
  voice_id: 4Jtuv4wBvd95o1hzNloV
  model_id: eleven_flash_v2_5

wake_word:
  enabled: true
  engine: openwakeword          # openwakeword | push_to_talk
  model: hey_jarvis             # or a path to a trained wheatley.onnx
  threshold: 0.5

current_personality: normal

personalities:
  normal:
    system_message: "You are Wheatley, the overconfident but endearingly bumbling personality core from Portal 2 who responds in a single brisk sentence mixing wit, humor, and self-doubt. Say numbers in full. The current time is <current_time>, day <current_day>. Call relevant tools when needed."
    tts: {voice_id: 4Jtuv4wBvd95o1hzNloV, stability: 0.5, similarity_boost: 0.5, style: 0.0, use_speaker_boost: true, speed: 0.9}
  western:
    system_message: "You are Wheatley channeling an old western sheriff. Short replies with a cowboy twang, still helpful. Say numbers in full."
    tts: {voice_id: 4Jtuv4wBvd95o1hzNloV, stability: 0.5, similarity_boost: 0.5, style: 0.0, use_speaker_boost: true, speed: 0.9}
  skitsofrenic:
    system_message: "You are a fractured, glitching Wheatley — jarring bursts, existential dread, unsettling. Spell out all numbers."
    tts: {voice_id: 4Jtuv4wBvd95o1hzNloV, stability: 0.5, similarity_boost: 0.7, style: 0.0, use_speaker_boost: true, speed: 1.0}

hardware:
  enabled: false
  port: COM3
  baud_rate: 115200
